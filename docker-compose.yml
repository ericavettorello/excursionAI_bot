# ExcursionAI — VPS (Timeweb Cloud)
# PostgreSQL только во внутренней сети compose; снаружи публикуется HTTP :80 (nginx).

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-excursion_ai}
      POSTGRES_USER: ${DB_USER:-excursion_ai_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Europe/Rome
      PGTZ: Europe/Rome
    volumes:
      # PostgreSQL 18+: mount volume at /var/lib/postgresql (not .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal
    # Порт 5432 наружу НЕ публикуем.

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AMOCRM_WEBHOOK_HOST: 0.0.0.0
      AMOCRM_WEBHOOK_PORT: "8080"
      AMOCRM_TOKEN_STORE_PATH: /app/data/amocrm_tokens.json
      TZ: Europe/Rome
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # 8080 наружу не публикуем — доступ только через proxy.

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bot
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
